[project]
name = "alpha"
version = "0.1.0"
description = "Detects named Keys in raw pediatric vitals, ready to feed into interconnected_zeta Locks."
requires-python = ">=3.9"
dependencies = [
    "zeta @ git+https://github.com/wking53214/interconnected_zeta",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alpha"]
