[project]
name = "alpha"
version = "0.2.0"
description = "Domain packs that detect named Keys in raw observations, ready to feed into interconnected_zeta Locks."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "zeta @ git+https://github.com/wking53214/interconnected_zeta@7cee0a35be741c6f299ffcd2a024c4edfcbaa80d",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Optional: lets alpha outputs be bound to a CNS verdict (alpha.cns_connector). Nothing in alpha imports cns otherwise.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alpha", "alpha.core", "alpha.packs", "alpha.packs.pediatric_vitals", "alpha.packs.service_health"]
